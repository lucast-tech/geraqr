<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GeraQR — Criação simples e rápida de QR Codes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/png" href="logo.png">
<script>
  (function () {
    try {
      var t = localStorage.getItem('geraqr-theme');
      if (!t) { t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
  })();
</script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <img src="logo.png" alt="GeraQR" class="mark">
        <div class="brand-text">
          <span class="brand-name">GeraQR</span>
          <span class="brand-tag">Criação simples e rápida de QR Codes</span>
        </div>
      </div>
      <button id="themeToggle" class="theme-toggle" type="button" aria-label="Alternar tema claro e escuro">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2M12 19.5v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2.5 12h2M19.5 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/></svg>
      </button>
    </header>

    <main>
      <section class="panel">
        <label for="qrInput" class="field-label">Texto, link ou contato</label>
        <textarea id="qrInput" class="field" rows="3" maxlength="1500" placeholder="Cole ou digite aqui o que você quer transformar em QR Code..."></textarea>
        <button id="generateBtn" class="btn-primary" type="button">Gerar QR Code</button>
      </section>

      <section class="viewfinder" id="viewfinder" aria-label="Pré-visualização do QR Code">
        <span class="corner tl"></span>
        <span class="corner tr"></span>
        <span class="corner bl"></span>
        <span class="corner br"></span>
        <div class="qr-stage">
          <p id="qrEmpty" class="qr-empty">Seu QR Code vai aparecer aqui</p>
          <canvas id="qrCanvas" hidden></canvas>
        </div>
      </section>

      <div class="actions" id="actions" hidden>
        <button id="copyBtn" class="btn-secondary" type="button">Copiar</button>
        <button id="downloadBtn" class="btn-secondary" type="button">Baixar PNG</button>
      </div>
      <p id="toast" class="toast" role="status" aria-live="polite"></p>
    </main>

    <footer class="footnote">
      <p>Gerado direto no seu navegador. Sem anúncios e sem enviar o seu texto a nenhum servidor. <a href="privacidade.html">Política de Privacidade</a></p>
    </footer>
  </div>

  <script src="qrcode.lib.js"></script>
  <script src="script.js"></script>
</body>
</html>
